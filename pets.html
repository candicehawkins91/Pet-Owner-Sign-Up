<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Management System</title>
  <link rel="stylesheet" href="pets.css">  
</head>

<body>
  <h1>Pet Manager</h1>
  <form id="petForm">
    <label for="petName">Pet Name</label>
    <input type="text" id="petName" placeholder="Enter pet name">

    <label for="petAge">Age</label>
    <input type="number" id="petAge" placeholder="Enter pet age">

    <label for="petSpecies">Species</label>
    <!-- Bonus: select element instead of text input -->
    <select id="petSpecies">
      <option value="">Choose species</option>
      <option value="Dog">Dog</option>
      <option value="Cat">Cat</option>
      <option value="Fish">Fish</option>
      <option value="Bird">Bird</option>
    </select>

    <!-- IMPORTANT: type="button" (no form submission) -->
    <button type="button" id="addPetBtn">Add Pet</button>
  </form>

  <!-- Script order matters! -->
  <script src="petCreator.js"></script>
  <script src="pets.js"></script>
</body>
</html>
